version: 2
project_name: ares-verify

builds:
  - id: ares-verify
    main: ./cmd/ares-verify
    binary: ares-verify
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid= -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - spec/*

checksum:
  name_template: checksums.txt

changelog:
  use: git
